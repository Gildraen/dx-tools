name: validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure ripgrep is available
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi

      - name: Validate
        run: task validate

      - name: Test without DX environment
        run: env -u DX_HOME -u DX_TOOLS_HOME task test

  release:
    name: Open or update release PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: Gildraen/ci-workflows/.github/workflows/reusable-release-please.yml@4b4026ff669b5fe8da2aa83e216591bb09e1e8a1 # 0.2.0
    with:
      config-file: release-please-config.json
      manifest-file: .release-please-manifest.json
      target-branch: main
    secrets:
      release-please-token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}