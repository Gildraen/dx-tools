name: validate

on:
  push:
    branches:
      - feat/component-extraction
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: go-task/setup-task@v2.2.0
        with:
          version: 3.53.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure ripgrep is available
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi

      - name: Validate
        run: task validate

      - name: Test without DX environment
        run: env -u DX_HOME -u DX_TOOLS_HOME task test