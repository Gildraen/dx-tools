name: release-please

on:
  workflow_run:
    workflows: [validate]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: Open or update release PR
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
    uses: Gildraen/ci-workflows/.github/workflows/reusable-release-please.yml@495bb9b377719414123af8c329b02aeff58ab440 # 0.2.0
    with:
      config-file: release-please-config.json
      manifest-file: .release-please-manifest.json
      target-branch: main
      expected-sha: ${{ github.event.workflow_run.head_sha }}
      app-client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}